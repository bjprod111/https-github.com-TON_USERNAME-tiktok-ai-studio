name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm ci || echo "no npm ci"
      - name: Build
        run: npm run build || echo "no build script"
      - name: Docker build
        run: IMAGE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'); docker build -t $IMAGE:${{ github.sha}} .

