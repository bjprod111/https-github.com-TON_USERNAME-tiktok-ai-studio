name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --silent

      - name: Build project
        run: npm run build

      - name: Docker build
        run: |
          IMAGE=$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")
          docker build -t "$IMAGE:${{ github.sha }}" .
